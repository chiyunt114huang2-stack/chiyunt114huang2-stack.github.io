<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>黃建瑋 Chien-Wei Huang | Resources</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #ffffff;
      color: #1e293b;
    }
    .serif-title {
      font-family: 'Noto Serif TC', serif;
    }
    /* 頂部柔和漸層背景 */
    .hero-gradient {
      background: linear-gradient(120deg, #eff6ff 0%, #f8fafc 45%, #fdf2f8 80%, #f0f9ff 100%);
    }
    /* 卡片頂部漸層線條 */
    .card-top-border {
      height: 4px;
      background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="w-full border-b border-slate-100 bg-white/80 backdrop-blur-md sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
      <!-- 左側 Logo 與姓名 -->
      <a href="#" class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-blue-600 text-white font-bold text-xs flex items-center justify-center shadow-sm">
          CW
        </div>
        <span class="font-bold text-slate-800 tracking-wide">黃建瑋 <span class="text-slate-400 font-normal ml-1">Chien-Wei Huang</span></span>
      </a>
      <!-- 右側選單 -->
      <nav class="flex items-center gap-6 text-sm text-slate-500">
        <a href="#courses" class="hover:text-blue-600 transition">課程</a>
        <a href="https://github.com/chiyunt114huang2-stack" target="_blank" class="hover:text-blue-600 transition flex items-center gap-1">
          GitHub ↗
        </a>
      </nav>
    </div>
  </header>

  <!-- 個人主視覺橫幅 (Hero Banner) -->
  <section class="hero-gradient border-b border-slate-100 py-14 px-6 text-center">
    <div class="max-w-3xl mx-auto">
      <div class="inline-block px-4 py-1 rounded-full bg-white/80 border border-blue-100 text-blue-600 text-xs font-semibold tracking-widest mb-5 shadow-sm">
        STATISTICS • FINANCE • DATA ANALYSIS
      </div>
      <h1 class="serif-title text-3xl md:text-4xl font-bold text-slate-900 mb-3">
        黃建瑋 <span class="text-slate-400 font-normal">Chien-Wei Huang</span>
      </h1>
      <p class="text-sm text-slate-500">
        銘傳大學 財務金融系 | Department of Finance, Ming Chuan University
      </p>
    </div>
  </section>

  <!-- 主要內容區：精選課程 -->
  <main id="courses" class="max-w-5xl w-full mx-auto px-6 py-12 flex-1">
    <!-- 分區標題 -->
    <div class="flex items-center gap-4 mb-8">
      <h2 class="text-xs font-bold tracking-widest text-slate-400 uppercase">
        精選課程 / FEATURED COURSES
      </h2>
      <div class="h-px bg-slate-100 flex-1"></div>
    </div>

    <!-- 課程卡片網格 (目前僅放置統計學) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- 統計學卡片 -->
      <a href="statistics.html" class="group block bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-200 overflow-hidden">
        <!-- 卡片上方藍色漸層條 -->
        <div class="card-top-border"></div>
        <div class="p-6">
          <!-- 圖示框 -->
          <div class="w-11 h-11 rounded-xl bg-blue-600 text-white flex items-center justify-center mb-5 shadow-sm group-hover:scale-105 transition-transform">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" />
            </svg>
          </div>
          <!-- 課程名稱 -->
          <h3 class="text-lg font-bold text-slate-800 mb-2 group-hover:text-blue-600 transition-colors">
            統計學
          </h3>
          <!-- 課程簡介 -->
          <p class="text-xs text-slate-500 leading-relaxed">
            涵蓋敘述統計、機率與機率分配、抽樣分配、區間估計、假設檢定與迴歸分析，搭配實務範例與筆記整理。
          </p>
        </div>
      </a>

    </div>
  </main>

  <!-- 頁尾 -->
  <footer class="border-t border-slate-100 py-6 text-center text-xs text-slate-400">
    © 2026 Chien-Wei Huang. Hosted on GitHub Pages.
  </footer>

</body>
</html>
